services:
  barkdog-detector:
    build:
      context: .
      dockerfile: Dockerfile.detector
    container_name: barkdog-detector
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - audio
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ./data:/app/data
      - ./models:/app/models:ro
      - ./detector.py:/app/detector.py:ro

  barkdog-yamnet:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: barkdog-yamnet
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
    ports:
      - "8085:80"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ./public:/usr/share/nginx/html:ro
      - ./data:/data:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - barkdog-detector
