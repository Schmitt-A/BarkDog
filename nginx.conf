server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # MIME-Types für Audio, CSV und Modell-Dateien
    include /etc/nginx/mime.types;
    types {
        text/csv csv;
        audio/wav wav;
    }

    # Statische Modellgewichte und Bibliotheken cachen
    location ~* \.(wasm|bin|csv)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        add_header Access-Control-Allow-Origin "*";
    }

    # REST-API an Python-Detektor weiterleiten
    location /api/ {
        proxy_pass http://barkdog-detector:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Live-Daten aus dem separaten Datenvolume (/data)
    location /data/ {
        alias /data/;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
    }

    # Anwendungsdateien
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
    }

    # Fehlerseiten
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
